# ============================================================
# Personal Expense Tracker - Spring Boot configuration
#
# Secrets (DB password, JWT secret) are NOT committed.
# They come from environment variables with local-only defaults
# so the app runs out of the box in development.
#
# For production set these environment variables yourself:
#   DB_URL  DB_USERNAME  DB_PASSWORD  JWT_SECRET
# ============================================================
spring.application.name=expense-tracker-backend
server.port=8080

# ===== PostgreSQL =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/expense_tracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
# update: Hibernate aligns tables with the entities on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===== JWT =====
# Secret must be a Base64-encoded value of at least 32 bytes (HS256).
# Generate one with:  openssl rand -base64 48
app.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLWF0LWxlYXN0LXRoaXJ0eS1ieXRlcw==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== Swagger / OpenAPI =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===== Jackson =====
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== Logging =====
logging.level.com.expense.tracker=INFO